name: Deploy virtual machines
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: 'Type "apply" to run terraform apply against the lab. Anything else plans only.'
        required: true
        type: string

jobs:
  # Credential-free: the only job an untrusted pull_request branch runs.
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    runs-on: lab
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

  # Credentialed: never runs on pull_request, so PR branches never see the
  # S3, VCFA or GitHub secrets.
  plan:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: lab

    env:
      # State backend credentials (lab S3). The S3 backend reads the AWS_*
      # names, so the lab key is passed under them; nothing here talks to AWS.
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_S3_SECRET_ACCESS_KEY }}
      VCFA_PROJECT_NAME: ${{ secrets.VCFA_PROJECT_NAME }}
      VCFA_PROJECT_ID:   ${{ secrets.VCFA_PROJECT_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # vSphere / vRA / VCF environment-specific credentials
      TF_VAR_serviceAccountUserName: ${{ secrets.KRB_SERVICE_USER }}
      TF_VAR_serviceAccountPassword: ${{ secrets.SERVICEACCOUNTPASSWORD }}
      TF_VAR_krb_realm: ${{ secrets.KRB_REALM }}
      KRB5_CONFIG: ${{ secrets.KRB5_CONF}}
      TF_VAR_dns_server: ${{ secrets.DNS_SERVER }}
      TF_VAR_vcfa_refresh_token: ${{ secrets.VCFA_REFRESH_TOKEN}}
      TF_VAR_project_name: ${{ secrets.VCFA_PROJECT_NAME}}
      TF_VAR_vcfa_organization: ${{ secrets.VCFA_ORGANIZATION_NAME}}
      TF_VAR_vcfa_url: ${{ vars.VCFA_URL}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: |
              terraform plan -input=false -no-color \
              -var-file="envs/lab.tfvars" \
              -out=tfplan

      # Apply is manual only: a push to main never applies. The plan file
      # stays on the runner (it carries credentials; never upload it).
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_apply == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Clean workspace
        if: always()
        run: rm -rf $GITHUB_WORKSPACE/.[!.]*
